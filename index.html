<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오픈코트</title>
<meta name="description" content="친선 복식 경기 대진표 — 참석 응답, 자동 코트 배정, 각자 결과 입력, 순위">
<meta name="theme-color" content="#EDF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오픈코트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 휴대폰 한 손 조작: 상단 고정 탭, 한 줄 흐름, 경기는 위에서 본 미니 코트, 핵심 행동은 하단 고정 버튼 */
:root{
  --paper:#EDF1EE; --surface:#FFFFFF; --ink:#13201B; --muted:#5A6A63; --line:#D2DBD6;
  --court:#2E6B57; --court-in:#387A64; --chalk:#F3F7F4; --ball:#E3CF3A; --ball-ink:#2A2606;
  --accent-text:#2E6B57; --danger:#B4452F; --gold:#C49A1C; --silver:#8E9B95; --bronze:#A5683A;
  --shade:rgba(19,32,27,.45);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r-sm:8px; --r-md:14px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0E1512; --surface:#16211D; --ink:#E3ECE7; --muted:#93A39C; --line:#28362F;
  --court:#23574A; --court-in:#2C6655; --chalk:#E6EEEA; --ball:#E6D44A; --ball-ink:#1E1B03;
  --accent-text:#E6D44A; --danger:#E3826B; --gold:#D9B23A; --silver:#A9B5AF; --bronze:#C88552;
  --shade:rgba(0,0,0,.6); color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:150px;scroll-padding-bottom:120px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.skip{position:absolute;left:-9999px;top:0}
.skip:focus{left:16px;top:calc(8px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 누르는 느낌: 모든 버튼 공통 */
.press{transition:transform 160ms var(--ease-out),opacity 160ms ease}
.press:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.press,.press:active{transition:opacity 160ms ease;transform:none}}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px))}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 10px}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand .ttl{min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:25px;letter-spacing:-.01em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin:4px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.live::before{background:var(--court);box-shadow:0 0 0 3px color-mix(in srgb,var(--court) 25%,transparent)}
.pill.done::before{background:var(--gold)}
.net{font-size:12px;color:var(--danger);white-space:nowrap;padding-top:4px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:8px 0;font-weight:500;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{background:var(--court);color:var(--chalk)}
.tabs .dot{display:inline-block;vertical-align:super;margin-left:3px;width:7px;height:7px;border-radius:50%;background:var(--ball)}
@media (hover:hover) and (pointer:fine){.tabs button:not([aria-selected="true"]):hover{color:var(--ink)}}

/* 블록 */
.block{margin-top:22px}
.block>h2{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.block>h2 small{font-weight:400;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>label,.row>.lbl{font-weight:500;min-width:0}
.hint{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-shrink:0}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:14px;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.step{display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:18px;line-height:1}
.step output{min-width:48px;text-align:center;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.toggle{position:relative;width:48px;height:28px;flex-shrink:0;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;margin:0;cursor:pointer;transition:background-color 160ms ease}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform 200ms var(--ease-out)}
.toggle:checked{background:var(--court)}
.toggle:checked::after{transform:translateX(20px)}
.field{display:grid;gap:4px;padding:12px 14px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{font-size:13px;color:var(--muted)}
.in{width:100%;min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);padding:10px 12px;font-size:16px}
.in:focus-visible{outline:2px solid var(--court);outline-offset:0;border-color:var(--court)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary{margin:10px 2px 0;color:var(--muted);font-size:13.5px}
.summary b{color:var(--ink);font-weight:700}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-text);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.note{margin-top:14px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);border:1px dashed var(--line);font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
.banner{margin-top:14px;padding:12px 14px;border-radius:var(--r-sm);background:var(--ball);color:var(--ball-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:500}
.banner span{min-width:0}
.banner button{border:0;border-radius:999px;background:var(--ball-ink);color:var(--ball);padding:8px 14px;font-weight:700;flex-shrink:0}

/* 버튼 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--paper) 72%,transparent);padding-top:22px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock:empty{display:none}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.primary{flex:1;border:0;border-radius:999px;background:var(--court);color:var(--chalk);padding:15px 18px;font-weight:700;font-size:16px;min-height:52px}
.primary:disabled{opacity:.5;cursor:not-allowed}
.secondary{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:14px 18px;font-weight:500;min-height:52px}
.small{min-height:36px;padding:7px 14px;font-size:14px}
.armed{background:var(--danger)!important;color:#fff!important;border-color:var(--danger)!important}
@media (hover:hover) and (pointer:fine){.primary:not(:disabled):hover{background:color-mix(in srgb,var(--court) 88%,var(--ink))}.secondary:hover{border-color:var(--muted)}}

/* 참가자 목록 */
.add{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.add .in{border-radius:999px}
.add button{border:0;border-radius:999px;background:var(--ink);color:var(--paper);padding:0 16px;font-weight:700;flex-shrink:0}
.player{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.player:first-of-type{border-top:0}
.player.off .pname{color:var(--muted)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--court);border-color:var(--court)}
.check[aria-pressed="true"]::after{content:"";width:9px;height:5px;border:2px solid var(--chalk);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.pname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.lv{min-width:52px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;padding:0 10px;white-space:nowrap}
.lv.unset{font-weight:400;color:var(--muted)}
.del{width:32px;height:32px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;border-radius:50%}
.del.armed{width:auto;padding:0 10px;font-size:12px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.chip.static{cursor:default}
.chip small{color:var(--muted);margin-left:4px}
.team{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-top:1px solid var(--line)}
.team b{font-weight:500;min-width:0}

/* 미니 코트 */
.court{position:relative;display:grid;grid-template-columns:1fr 6px 1fr;aspect-ratio:2.05/1;max-width:100%;background:var(--court);border-radius:6px;padding:9px}
.half{position:relative;border:2px solid var(--chalk);background:var(--court-in);display:grid;grid-template-rows:1fr 1fr;padding:0;color:var(--chalk);text-align:center;font:inherit}
.half.a{border-right:0}.half.b{border-left:0}
.half::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--chalk);opacity:.85}
.half::after{content:"";position:absolute;top:calc(50% - 1px);height:2px;background:var(--chalk);opacity:.85}
.half.a::before{right:32%}.half.a::after{left:0;right:32%}
.half.b::before{left:32%}.half.b::after{right:0;left:32%}
.half .pl{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(13px,3.6vw,16px);line-height:1.2;padding:0 4px;min-width:0;word-break:keep-all}
.half.a .pl{margin-right:32%}.half.b .pl{margin-left:32%}
.half .pl.me{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.half.mine{box-shadow:inset 0 0 0 3px var(--ball)}
.half.win{background:var(--ball)}
.half.win .pl{color:var(--ball-ink)}
.half.lose{opacity:.62}
.net-line{position:relative;background:var(--chalk);opacity:.95}
.net-line::before,.net-line::after{content:"";position:absolute;left:-3px;width:12px;height:6px;border-radius:2px;background:var(--chalk)}
.net-line::before{top:-9px}.net-line::after{bottom:-9px}
.score{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 2px 8px var(--shade);pointer-events:none}
.court.empty{display:grid;place-items:center;grid-template-columns:1fr;color:var(--chalk);font-weight:500;opacity:.75}
.cwrap .clabel{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);margin:0 2px 6px}
.cwrap .clabel b{color:var(--ink);font-weight:700}
.cwrap .clabel span{min-width:0;text-align:right}
.courts{display:grid;gap:18px;margin-top:16px}
.tap{display:block;width:100%;border:0;background:none;padding:0;text-align:left}

/* 내 경기 */
.hero{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px 16px}
.hero.play{border-color:var(--court);box-shadow:0 0 0 2px color-mix(in srgb,var(--court) 30%,transparent)}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.hero-k{margin:0;font-size:14px;font-weight:700;color:var(--muted)}
.hero-court{display:flex;align-items:baseline;gap:4px;font-family:var(--display);line-height:.9}
.hero-court .num{font-size:64px;color:var(--accent-text)}
.hero-court .unit{font-size:24px}
.hero h2{margin:2px 0 0;font-size:22px;line-height:1.3}
.hero .why{margin:0 0 14px;font-size:15px}
.hero .why b{font-weight:700}
.vs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0 0 14px;font-size:15px}
.vs dt{color:var(--muted)}
.vs dd{margin:0;font-weight:700;word-break:keep-all}
.elapsed{margin:10px 0 0;font-size:13px;color:var(--muted);text-align:center}
.recline{display:flex;gap:16px;margin-top:14px;font-size:14px;color:var(--muted)}
.recline b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:20px;margin-right:2px;font-variant-numeric:tabular-nums}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list li span:first-child{color:var(--muted);flex-shrink:0}
.list li span:last-child{text-align:right;min-width:0}

/* 대기열 */
.queue li{align-items:flex-start}
.queue .q-who{display:block;font-weight:500;color:var(--ink)}
.queue .q-why{display:block;font-size:12.5px;color:var(--muted)}

/* 순위 */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:18px}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 8px 12px;text-align:center;min-width:0}
.pod .medal{width:46px;height:46px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:#fff}
.pod.g{padding-block:24px 16px}.pod.g .medal{width:58px;height:58px;font-size:30px;background:var(--gold)}
.pod.s .medal{background:var(--silver)}.pod.b .medal{background:var(--bronze)}
.pod .who{font-weight:700;word-break:keep-all;line-height:1.3}
.pod .rec{font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;margin-top:16px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
th{font-weight:500;font-size:12.5px;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:11px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child{font-family:var(--display);font-size:18px;text-align:center;width:40px}
td:nth-child(2){font-weight:500}
tr.me td{background:color-mix(in srgb,var(--ball) 18%,transparent)}
tr.top3 td:first-child{color:var(--accent-text)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* 홈 */
.home-hero{margin-top:28px}
.home-hero h1{margin:0;font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05}
.home-hero p{margin:10px 0 0;color:var(--muted);max-width:34em}
.recent a{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.recent a:first-child{border-top:0}
.recent a span:last-child{color:var(--muted);font-size:13px;flex-shrink:0}

/* 시트 */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--shade);opacity:0;transition:opacity 200ms ease;overscroll-behavior:contain}
.sheet[data-open]{opacity:1;transition-duration:300ms}
.sheet-in{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform 200ms var(--ease-out)}
.sheet[data-open] .sheet-in{transform:translateY(0);transition:transform 340ms var(--ease-drawer)}
@media (prefers-reduced-motion: reduce){.sheet-in,.sheet[data-open] .sheet-in{transform:none;transition:none}}
.sheet h3{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.sheet .big{font-size:19px;font-weight:700;margin:2px 0 14px;word-break:keep-all}
.teampick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 16px}
.teampick button{border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:12px 8px;font-weight:700;word-break:keep-all;min-height:64px}
.teampick button[aria-pressed="true"]{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.teampick small{display:block;font-weight:400;font-size:12px;opacity:.75}
.scoreline{display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--display);font-size:44px;line-height:1;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.scoreline .w{color:var(--accent-text)}
.scoreline .sep{font-size:28px;color:var(--muted)}
.scoreline small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);margin-top:4px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.pad button{height:46px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper);font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.pad button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.deuce{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--paper)}
.sheet-actions{display:flex;gap:8px;margin-top:18px}
.ghost{border:0;background:none;color:var(--danger);font-weight:500;padding:12px 8px}
.err{color:var(--danger);font-size:13.5px;margin:8px 2px 0}

/* 알림 */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:25;max-width:min(92vw,480px);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:16px;font-size:14px;font-weight:500;text-align:center;text-wrap:pretty;box-shadow:0 6px 20px var(--shade);transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:transform 200ms var(--ease-out),opacity 200ms ease}
.toast[data-show]{transform:translate(-50%,0);opacity:1}

<a class="skip" href="#view">본문으로 건너뛰기</a>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view" tabindex="-1"></main>
</div>
<div class="dock" id="dock"></div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>/* 오픈코트 복식 대진 엔진
 * - rotation: 라운드마다 짝을 바꾸는 친선전 (개인 순위)
 * - fixed   : 호스트가 정한 고정 복식 팀 리그 (팀 순위)
 * 브라우저(window.Engine)와 Node(require) 양쪽에서 동작
 */
(function (root) {
  'use strict';

  // ---------- 유틸 ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  const pk = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
  const inc = (m, k, v = 1) => m.set(k, (m.get(k) || 0) + v);

  // 급수: A(5) B(4) C(3) D(2) 초심(1), 미지정은 3으로 취급
  const LEVELS = [
    { key: 'A', label: 'A', v: 5 },
    { key: 'B', label: 'B', v: 4 },
    { key: 'C', label: 'C', v: 3 },
    { key: 'D', label: 'D', v: 2 },
    { key: 'E', label: '초심', v: 1 },
  ];
  const levelValue = (lv) => (LEVELS.find((l) => l.key === lv) || { v: 3 }).v;

  // 0..k-1 의 모든 완전매칭 (k 짝수)
  const matchCache = {};
  function matchings(k) {
    if (matchCache[k]) return matchCache[k];
    const res = [], used = new Array(k).fill(false), cur = [];
    (function rec() {
      let i = 0;
      while (i < k && used[i]) i++;
      if (i === k) { res.push(cur.slice()); return; }
      used[i] = true;
      for (let j = i + 1; j < k; j++) {
        if (used[j]) continue;
        used[j] = true; cur.push([i, j]);
        rec();
        cur.pop(); used[j] = false;
      }
      used[i] = false;
    })();
    return (matchCache[k] = res);
  }

  function combinations(arr, r, limit, rnd) {
    // arr에서 r개 고르는 조합 (너무 많으면 무작위 limit개 표본)
    const out = [];
    const total = choose(arr.length, r);
    if (total <= limit) {
      (function rec(start, cur) {
        if (cur.length === r) { out.push(cur.slice()); return; }
        for (let i = start; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
      })(0, []);
      return out;
    }
    const seen = new Set();
    let guard = 0;
    while (out.length < limit && guard++ < limit * 20) {
      const pick = shuffle(arr, rnd).slice(0, r);
      const key = pick.slice().sort().join(',');
      if (!seen.has(key)) { seen.add(key); out.push(pick); }
    }
    return out;
  }
  function choose(n, r) {
    if (r < 0 || r > n) return 0;
    let c = 1;
    for (let i = 0; i < r; i++) c = (c * (n - i)) / (i + 1);
    return Math.round(c);
  }

  // ---------- 기록 집계 ----------
  function buildStats(rounds) {
    const s = {
      partner: new Map(), opp: new Map(),
      played: new Map(), rested: new Map(), restedLast: new Set(),
      sameCourtLast: new Set(),
    };
    rounds.forEach((r, idx) => {
      const last = idx === rounds.length - 1;
      r.matches.forEach((m) => {
        const [a1, a2] = m.a, [b1, b2] = m.b;
        inc(s.partner, pk(a1, a2)); inc(s.partner, pk(b1, b2));
        [a1, a2].forEach((x) => [b1, b2].forEach((y) => inc(s.opp, pk(x, y))));
        [a1, a2, b1, b2].forEach((p) => inc(s.played, p));
        if (last) [a1, a2, b1, b2].forEach((p) => s.sameCourtLast.add(p));
      });
      (r.rest || []).forEach((p) => {
        inc(s.rested, p);
        if (last) s.restedLast.add(p);
      });
    });
    return s;
  }

  // ---------- 로테이션: 한 라운드 ----------
  const W = { partner: 1000, opp: 30, level: 60, restRepeat: 400 };

  function bestPairing(ids, stats, levelOf, balance, rnd) {
    const k = ids.length;
    const P = shuffle(ids, rnd);
    const pc = (i, j) => stats.partner.get(pk(P[i], P[j])) || 0;
    const oc = (i, j) => stats.opp.get(pk(P[i], P[j])) || 0;
    const lv = P.map(levelOf);

    if (k > 12) return localSearchPairing(P, pc, oc, lv, balance, rnd);

    const ms = shuffle(matchings(k), rnd);
    const groupings = matchings(k / 2);
    let best = null, bestCost = Infinity;
    for (const m of ms) {
      let partnerCost = 0;
      for (const [i, j] of m) partnerCost += W.partner * pc(i, j);
      if (partnerCost >= bestCost) continue;
      for (const g of groupings) {
        let cost = partnerCost;
        for (const [x, y] of g) {
          const [a1, a2] = m[x], [b1, b2] = m[y];
          cost += W.opp * (oc(a1, b1) + oc(a1, b2) + oc(a2, b1) + oc(a2, b2));
          if (balance) cost += W.level * Math.abs(lv[a1] + lv[a2] - lv[b1] - lv[b2]);
          if (cost >= bestCost) break;
        }
        if (cost < bestCost) {
          bestCost = cost;
          best = g.map(([x, y]) => ({ a: [P[m[x][0]], P[m[x][1]]], b: [P[m[y][0]], P[m[y][1]]] }));
        }
      }
    }
    return { matches: best, cost: bestCost };
  }

  // 13명 이상이 동시에 코트에 서는 경우(코트 4면 이상) — 지역 탐색
  function localSearchPairing(P, pc, oc, lv, balance, rnd) {
    const k = P.length;
    const costOf = (ord) => {
      let c = 0;
      for (let t = 0; t < k; t += 4) {
        const [a1, a2, b1, b2] = [ord[t], ord[t + 1], ord[t + 2], ord[t + 3]];
        c += W.partner * (pc(a1, a2) + pc(b1, b2));
        c += W.opp * (oc(a1, b1) + oc(a1, b2) + oc(a2, b1) + oc(a2, b2));
        if (balance) c += W.level * Math.abs(lv[a1] + lv[a2] - lv[b1] - lv[b2]);
      }
      return c;
    };
    let bestOrd = null, bestCost = Infinity;
    for (let rs = 0; rs < 40; rs++) {
      let ord = shuffle([...Array(k).keys()], rnd), cost = costOf(ord), improved = true;
      while (improved) {
        improved = false;
        for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++) {
          [ord[i], ord[j]] = [ord[j], ord[i]];
          const c = costOf(ord);
          if (c < cost) { cost = c; improved = true; } else [ord[i], ord[j]] = [ord[j], ord[i]];
        }
      }
      if (cost < bestCost) { bestCost = cost; bestOrd = ord.slice(); }
    }
    const matches = [];
    for (let t = 0; t < k; t += 4) {
      const o = bestOrd;
      matches.push({ a: [P[o[t]], P[o[t + 1]]], b: [P[o[t + 2]], P[o[t + 3]]] });
    }
    return { matches, cost: bestCost };
  }

  function nextRotationRound(presentIds, courts, history, levelOf, balance, rnd) {
    const n = presentIds.length;
    const used = Math.min(courts, Math.floor(n / 4));
    if (used < 1) return null;
    const k = used * 4, restN = n - k;
    const stats = buildStats(history);

    // 쉬는 사람 고르기: 출전 비율이 높은 사람부터 쉼 (경기 수 균등이 1순위)
    // 직전에 쉰 사람이 또 쉬는 건 금지가 아니라 비용으로 — 금지하면 같은 4명끼리만 도는 고착이 생김
    const rate = (p) => {
      const pl = stats.played.get(p) || 0, rs = stats.rested.get(p) || 0;
      return pl + rs === 0 ? -1 : pl / (pl + rs);
    };
    const restKey = (p) => Math.round(rate(p) * 1e6) / 1e6;

    let restSets = [[]];
    if (restN > 0) {
      const sorted = shuffle(presentIds, rnd).sort((x, y) => restKey(y) - restKey(x));
      const cutoff = restKey(sorted[restN - 1]);
      const sure = sorted.filter((p) => restKey(p) > cutoff + 1e-9);
      const tie = sorted.filter((p) => Math.abs(restKey(p) - cutoff) < 1e-9);
      const need = restN - sure.length;
      const lim = k >= 12 ? 8 : 24;
      restSets = combinations(tie, need, lim, rnd).map((c) => sure.concat(c));
    }

    let best = null;
    for (const rest of restSets) {
      const restSet = new Set(rest);
      const act = presentIds.filter((p) => !restSet.has(p));
      const r = bestPairing(act, stats, levelOf, balance, rnd);
      const restCost = rest.filter((p) => stats.restedLast.has(p)).length * W.restRepeat;
      const cost = r.cost + restCost;
      if (!best || cost < best.cost) best = { ...r, cost, rest };
    }
    return {
      matches: best.matches.map((m, i) => ({ court: i + 1, a: m.a, b: m.b, sa: null, sb: null })),
      rest: best.rest,
    };
  }

  // ---------- 고정 복식: 팀 리그 ----------
  function circleOrder(teamIds) {
    let t = teamIds.slice();
    if (t.length % 2) t.push(null);
    const n = t.length, list = [];
    for (let r = 0; r < n - 1; r++) {
      for (let i = 0; i < n / 2; i++) {
        const a = t[i], b = t[n - 1 - i];
        if (a != null && b != null) list.push([a, b]);
      }
      t = [t[0], t[n - 1]].concat(t.slice(1, n - 1));
    }
    return list;
  }

  function planFixed(event, lockedRounds) {
    const teams = event.teams.filter((t) => t.p.every((p) => isPresent(event, p)));
    const teamOf = {};
    teams.forEach((t) => (teamOf[t.id] = t));
    const done = new Set();
    const games = new Map(), restedLast = new Set();
    lockedRounds.forEach((r, idx) => {
      r.matches.forEach((m) => {
        done.add(pk(m.ta, m.tb)); inc(games, m.ta); inc(games, m.tb);
      });
      if (idx === lockedRounds.length - 1) (r.restTeams || []).forEach((t) => restedLast.add(t));
    });
    let remaining = circleOrder(teams.map((t) => t.id)).filter(([a, b]) => !done.has(pk(a, b)));
    const out = [];
    const C = Math.min(event.courts, Math.floor(teams.length / 2));
    if (C < 1) return out;
    let lastRest = restedLast;
    while (remaining.length) {
      const order = remaining
        .map((m, i) => ({ m, i }))
        .sort((x, y) => {
          const pri = (mm) => (games.get(mm[0]) || 0) + (games.get(mm[1]) || 0)
            - 3 * ((lastRest.has(mm[0]) ? 1 : 0) + (lastRest.has(mm[1]) ? 1 : 0));
          return pri(x.m) - pri(y.m) || x.i - y.i;
        });
      const busy = new Set(), pick = [];
      for (const { m, i } of order) {
        if (pick.length >= C) break;
        if (busy.has(m[0]) || busy.has(m[1])) continue;
        busy.add(m[0]); busy.add(m[1]); pick.push(i);
      }
      const ms = pick.map((i) => remaining[i]);
      remaining = remaining.filter((_, i) => !pick.includes(i));
      ms.forEach(([a, b]) => { inc(games, a); inc(games, b); });
      const restTeams = teams.map((t) => t.id).filter((t) => !busy.has(t));
      lastRest = new Set(restTeams);
      out.push({
        matches: ms.map(([a, b], i) => ({
          court: i + 1, ta: a, tb: b, a: teamOf[a].p.slice(), b: teamOf[b].p.slice(), sa: null, sb: null,
        })),
        restTeams,
        rest: restTeams.flatMap((t) => teamOf[t].p),
      });
    }
    return out;
  }

  // ---------- 공통 ----------
  function isPresent(event, pid) {
    const p = event.players.find((x) => x.id === pid);
    return !!(p && p.present);
  }
  // 결과가 있거나, 코트에 배정되어 진행 중인 경기가 하나라도 있으면 그 라운드는 고정
  const isLocked = (r) => r.locked || r.matches.some((m) => m.sa != null || (m.state && m.state !== 'wait'));

  // 점수가 하나라도 들어간 라운드까지는 그대로 두고, 그 뒤만 다시 짠다
  function splitLocked(rounds) {
    let last = -1;
    rounds.forEach((r, i) => { if (isLocked(r)) last = i; });
    return rounds.slice(0, last + 1);
  }

  function scheduleScore(rounds, presentIds, levelOf, balance) {
    const s = buildStats(rounds);
    let repeat = 0, oppSq = 0, lvl = 0, consecRest = 0;
    s.partner.forEach((c) => { if (c > 1) repeat += c - 1; });
    s.opp.forEach((c) => { oppSq += c * c; });
    const pl = presentIds.map((p) => s.played.get(p) || 0);
    const spread = pl.length ? Math.max(...pl) - Math.min(...pl) : 0;
    for (let i = 1; i < rounds.length; i++) {
      const prev = new Set(rounds[i - 1].rest || []);
      (rounds[i].rest || []).forEach((p) => { if (prev.has(p)) consecRest++; });
    }
    if (balance) rounds.forEach((r) => r.matches.forEach((m) => {
      lvl += Math.abs(levelOf(m.a[0]) + levelOf(m.a[1]) - levelOf(m.b[0]) - levelOf(m.b[1]));
    }));
    return {
      total: repeat * 1000 + spread * 500 + consecRest * 400 + oppSq * 2 + lvl * 20,
      repeat, spread, consecRest, oppSq, lvl,
    };
  }

  /**
   * plan(event, opts) → 새 rounds 배열
   * opts.rounds: 로테이션 총 라운드 수 (기본: 추천값)
   * opts.restarts: 전체 일정 재시도 횟수 (가장 공평한 일정 채택)
   */
  function plan(event, opts = {}) {
    const locked = splitLocked(event.rounds || []);
    // 종목별 실력 환산은 호출하는 쪽(core)이 넘겨줌. 없으면 기본 급수표 사용
    const levelOf = opts.levelOf || ((pid) => {
      const p = event.players.find((x) => x.id === pid);
      return levelValue(p && p.level);
    });
    const seed = opts.seed != null ? opts.seed : (Date.now() & 0xffffffff);

    if (event.mode === 'fixed') {
      const fut = planFixed(event, locked);
      return locked.concat(fut).map((r, i) => ({ ...r, no: i + 1 }));
    }

    const present = event.players.filter((p) => p.present).map((p) => p.id);
    const total = opts.rounds || recommendRounds(present.length, event.courts).rounds;
    const need = Math.max(0, total - locked.length);
    const balance = !!event.balanceLevel;
    const restarts = opts.restarts || defaultRestarts(present.length, event.courts);

    let best = null;
    for (let t = 0; t < restarts; t++) {
      const rnd = mulberry32(seed + t * 7919);
      const rounds = locked.slice();
      for (let i = 0; i < need; i++) {
        const r = nextRotationRound(present, event.courts, rounds, levelOf, balance, rnd);
        if (!r) break;
        rounds.push(r);
      }
      const sc = scheduleScore(rounds, present, levelOf, balance);
      if (!best || sc.total < best.sc.total) best = { rounds, sc };
      if (sc.total === 0) break;
    }
    return best.rounds.map((r, i) => ({ ...r, no: i + 1 }));
  }

  function defaultRestarts(n, courts) {
    const k = Math.min(courts, Math.floor(n / 4)) * 4;
    if (k >= 12) return 6;
    if (k >= 8) return 30;
    return 60;
  }

  // 모두가 한 번씩 짝이 되려면 몇 라운드가 필요한가
  function recommendRounds(n, courts) {
    const used = Math.min(courts, Math.floor(n / 4));
    if (used < 1) return { rounds: 0, used: 0, perRoundRest: n, gamesEach: 0 };
    const pairs = (n * (n - 1)) / 2;               // 가능한 짝 수
    const rounds = Math.ceil(pairs / (2 * used));   // 한 경기에 짝 2개 소화
    return {
      rounds, used, perRoundRest: n - used * 4,
      gamesEach: +((rounds * used * 4) / n).toFixed(1),
    };
  }

  // ---------- 순위 ----------
  function standings(event) {
    const rows = new Map();
    const fixed = event.mode === 'fixed';
    const ensure = (id, name) => {
      if (!rows.has(id)) rows.set(id, { id, name, g: 0, w: 0, l: 0, pf: 0, pa: 0 });
      return rows.get(id);
    };
    const nameOf = (pid) => (event.players.find((p) => p.id === pid) || { name: '?' }).name;
    const teamName = (tid) => {
      const t = event.teams.find((x) => x.id === tid);
      return t ? t.p.map(nameOf).join(' · ') : '?';
    };
    if (fixed) event.teams.forEach((t) => ensure(t.id, teamName(t.id)));
    else event.players.filter((p) => p.present || hasPlayed(event, p.id)).forEach((p) => ensure(p.id, p.name));

    (event.rounds || []).forEach((r) => r.matches.forEach((m) => {
      if (m.sa == null || m.sb == null) return;
      const sides = fixed ? [[m.ta], [m.tb]] : [m.a, m.b];
      const sc = [m.sa, m.sb];
      [0, 1].forEach((s) => sides[s].forEach((id) => {
        const row = ensure(id, fixed ? teamName(id) : nameOf(id));
        row.g++; row.pf += sc[s]; row.pa += sc[1 - s];
        if (sc[s] > sc[1 - s]) row.w++; else row.l++;
      }));
    }));

    const list = [...rows.values()].map((r) => ({
      ...r, diff: r.pf - r.pa, rate: r.g ? r.w / r.g : 0,
    }));
    list.sort((a, b) => b.rate - a.rate || b.diff - a.diff || b.pf - a.pf || a.name.localeCompare(b.name, 'ko'));
    list.forEach((r, i) => {
      const prev = list[i - 1];
      r.rank = prev && prev.rate === r.rate && prev.diff === r.diff && prev.pf === r.pf ? prev.rank : i + 1;
    });
    return list;
  }
  function hasPlayed(event, pid) {
    return (event.rounds || []).some((r) => r.matches.some((m) => m.sa != null && (m.a.includes(pid) || m.b.includes(pid))));
  }

  const Engine = {
    LEVELS, levelValue, plan, standings, recommendRounds, buildStats, scheduleScore, isLocked, pk,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
  else root.Engine = Engine;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* 오픈코트 진행 로직 (서버 = 앱스크립트, 화면 = PWA 가 같은 코드를 씀)
 *
 * 상태(state) 하나에 모임 전체가 들어 있고, 모든 변경은 apply(state, action, ctx) 로만 일어난다.
 * phase: rsvp(참석 응답) → ready(대진 완료) → live(경기 중) → done(종료)
 * 경기(match) state: wait(대기) → play(코트 배정, 진행 중) → done(결과 입력) / void(취소)
 */
(function (root) {
  'use strict';
  const Engine = root.Engine || (typeof require !== 'undefined' ? require('./engine.js') : null);

  const SPORTS = {
    pickleball: { label: '피클볼', target: 11, minutes: 12, cap: null, levelKind: 'dupr' },
    badminton:  { label: '배드민턴', target: 21, minutes: 15, cap: 30, levelKind: 'grade' },
  };
  const GRADES = [
    { k: 'E', label: '초심', v: 1 }, { k: 'D', label: 'D', v: 2 }, { k: 'C', label: 'C', v: 3 },
    { k: 'B', label: 'B', v: 4 }, { k: 'A', label: 'A', v: 5 }, { k: 'S', label: '자강', v: 6 },
  ];
  const SELF_DUPR = ['2.0', '2.5', '3.0', '3.5', '4.0', '4.5', '5.0'];

  // ---------- 실력 ----------
  function levelLabel(sport, p) {
    if (!p || !p.level) return '';
    if (SPORTS[sport].levelKind === 'grade') {
      const g = GRADES.find((x) => x.k === p.level);
      return g ? g.label : '';
    }
    return p.levelSelf ? `${p.level} 자가` : `DUPR ${p.level}`;
  }
  function levelNum(sport, p) {
    if (!p || !p.level) return null;
    if (SPORTS[sport].levelKind === 'grade') {
      const g = GRADES.find((x) => x.k === p.level);
      return g ? g.v : null;
    }
    const n = parseFloat(p.level);
    return isFinite(n) ? n * 2 : null; // DUPR 0.5 차이 = 급수 1단계로 취급
  }
  function cleanLevel(sport, level) {
    if (level == null || level === '') return '';
    if (SPORTS[sport].levelKind === 'grade') return GRADES.some((g) => g.k === level) ? level : '';
    const n = parseFloat(level);
    if (!isFinite(n) || n < 1 || n > 8.5) return '';
    return String(Math.round(n * 1000) / 1000);
  }
  function makeLevelOf(state) {
    const known = state.players.map((p) => levelNum(state.sport, p)).filter((v) => v != null).sort((a, b) => a - b);
    const median = known.length ? known[Math.floor(known.length / 2)] : 3;
    const map = {};
    state.players.forEach((p) => { const v = levelNum(state.sport, p); map[p.id] = v == null ? median : v; });
    return (pid) => (map[pid] != null ? map[pid] : median);
  }

  // ---------- 생성 ----------
  function clampInt(v, lo, hi, dflt) {
    const n = parseInt(v, 10);
    return isFinite(n) ? Math.max(lo, Math.min(hi, n)) : dflt;
  }
  function str(v, max) { return String(v == null ? '' : v).trim().slice(0, max); }

  function newEvent(input, ctx) {
    const sport = SPORTS[input.sport] ? input.sport : 'pickleball';
    const s = {
      id: ctx.id(8), hostKey: ctx.id(14), v: 1, created: ctx.now,
      title: str(input.title, 40) || '오픈코트',
      date: str(input.date, 20), place: str(input.place, 40), note: str(input.note, 200),
      sport, courts: clampInt(input.courts, 1, 8, 2), mode: input.mode === 'fixed' ? 'fixed' : 'rotation',
      target: clampInt(input.target, 5, 31, SPORTS[sport].target),
      minutes: clampInt(input.minutes, 5, 40, SPORTS[sport].minutes),
      balanceLevel: !!input.balanceLevel, totalRounds: null,
      phase: 'rsvp', dirty: false, players: [], teams: [], rounds: [],
    };
    if (input.hostName) {
      s.players.push({ id: ctx.id(6), name: str(input.hostName, 16), level: cleanLevel(sport, input.hostLevel),
        levelSelf: !!input.hostLevelSelf, status: 'yes', src: 'host', present: true, dev: str(input.dev, 40) });
    }
    return s;
  }

  // ---------- 조회용 계산 ----------
  const allMatches = (s) => s.rounds.flatMap((r, ri) => r.matches.map((m) => Object.assign({ ri }, m)));
  const findMatch = (s, mid) => {
    for (const r of s.rounds) for (const m of r.matches) if (m.id === mid) return m;
    return null;
  };
  const presentSet = (s) => new Set(s.players.filter((p) => p.present).map((p) => p.id));
  const playersOf = (m) => m.a.concat(m.b);
  const totalRounds = (s) => s.totalRounds || Engine.recommendRounds(s.players.filter((p) => p.present).length, s.courts).rounds;

  // 진행 가능한 가장 앞 라운드 (취소·불참자 포함 경기는 건너뜀)
  function frontRound(s) {
    const pres = presentSet(s);
    return s.rounds.findIndex((r) => r.matches.some((m) =>
      m.state === 'play' || (m.state === 'wait' && playersOf(m).every((p) => pres.has(p)))));
  }

  // 비는 코트에 다음 경기를 자동 배정 (현재 라운드와 바로 다음 라운드까지만 당겨 씀)
  function assign(s, ctx) {
    if (s.phase !== 'live') return 0;
    const busy = new Set(), courtBusy = new Set(), pres = presentSet(s);
    allMatches(s).forEach((m) => {
      if (m.state === 'play') { playersOf(m).forEach((p) => busy.add(p)); courtBusy.add(m.court); }
    });
    const fr = frontRound(s);
    if (fr < 0) return 0;
    let n = 0;
    for (let ri = fr; ri <= fr + 1 && ri < s.rounds.length; ri++) {
      for (const m of s.rounds[ri].matches) {
        if (m.state !== 'wait') continue;
        const ps = playersOf(m);
        if (ps.some((p) => busy.has(p) || !pres.has(p))) continue;
        let c = null;
        if (m.court && m.court <= s.courts && !courtBusy.has(m.court)) c = m.court;
        else for (let k = 1; k <= s.courts; k++) if (!courtBusy.has(k)) { c = k; break; }
        if (c == null) return n;
        m.state = 'play'; m.court = c; m.startAt = ctx.now;
        courtBusy.add(c); ps.forEach((p) => busy.add(p)); n++;
      }
    }
    return n;
  }

  function draw(s, ctx) {
    // 진행 중에 다시 짜는 경우: 이미 시작했거나 끝난 경기가 있는 라운드는 남기고,
    // 그 안에서도 아직 시작 안 한 경기에 불참자가 있으면 취소 처리
    const pres = presentSet(s);
    s.rounds.forEach((r) => {
      if (!Engine.isLocked(r)) return;
      r.matches.forEach((m) => {
        if (m.state === 'wait' && playersOf(m).some((p) => !pres.has(p))) m.state = 'void';
      });
    });
    const ev = { mode: s.mode, courts: s.courts, balanceLevel: s.balanceLevel, players: s.players, teams: s.teams, rounds: s.rounds };
    const opts = { levelOf: makeLevelOf(s) };
    if (s.mode === 'rotation') opts.rounds = totalRounds(s);
    const rounds = Engine.plan(ev, opts);
    rounds.forEach((r) => r.matches.forEach((m) => {
      if (!m.id) m.id = ctx.id(6);
      if (!m.state) m.state = 'wait';
    }));
    s.rounds = rounds;
    s.dirty = false;
    if (s.phase === 'rsvp') s.phase = 'ready';
    assign(s, ctx);
  }

  function markDirty(s) { if (s.rounds.length && s.phase !== 'done') s.dirty = true; }

  // ---------- 동작 ----------
  const HOST_ONLY = new Set(['settings', 'addPlayer', 'setPlayer', 'removePlayer', 'setTeams', 'draw', 'start', 'finish', 'reopen', 'reset', 'voidMatch']);

  function err(msg) { return { error: msg }; }

  /** apply(state, action, ctx) → { ok:true } 또는 { error } (state 는 제자리 수정)
   *  ctx: { now, id(len), isHost, dev } */
  function apply(s, a, ctx) {
    if (HOST_ONLY.has(a.type) && !ctx.isHost) return err('호스트만 할 수 있는 작업입니다.');
    const P = (pid) => s.players.find((p) => p.id === pid);
    let r;
    switch (a.type) {
      case 'rsvp': r = rsvp(s, a, ctx); break;
      case 'settings': r = settings(s, a); break;
      case 'addPlayer': {
        const name = str(a.name, 16);
        if (!name) return err('이름을 입력하세요.');
        if (s.players.some((p) => p.name === name)) return err(`${name} 님은 이미 명단에 있습니다.`);
        const p = { id: ctx.id(6), name, level: cleanLevel(s.sport, a.level), levelSelf: !!a.levelSelf, status: 'yes', src: 'walkin', present: true, dev: '' };
        s.players.push(p); markDirty(s); r = { ok: true, pid: p.id };
        break;
      }
      case 'setPlayer': {
        const p = P(a.pid); if (!p) return err('없는 참가자입니다.');
        if (a.present != null && p.present !== !!a.present) { p.present = !!a.present; markDirty(s); }
        if (a.level !== undefined) { p.level = cleanLevel(s.sport, a.level); p.levelSelf = !!a.levelSelf; if (s.balanceLevel) markDirty(s); }
        if (a.name) { const n = str(a.name, 16); if (n && !s.players.some((q) => q !== p && q.name === n)) p.name = n; }
        r = { ok: true }; break;
      }
      case 'removePlayer': {
        const played = allMatches(s).some((m) => m.state !== 'wait' && m.state !== 'void' && playersOf(m).includes(a.pid));
        if (played) { const p = P(a.pid); if (p) p.present = false; }
        else { s.players = s.players.filter((p) => p.id !== a.pid); s.teams = s.teams.filter((t) => !t.p.includes(a.pid)); }
        markDirty(s); r = { ok: true }; break;
      }
      case 'setTeams': {
        const ids = new Set(s.players.map((p) => p.id)), used = new Set();
        const teams = [];
        for (const t of (a.teams || [])) {
          if (!Array.isArray(t) || t.length !== 2 || t[0] === t[1] || !ids.has(t[0]) || !ids.has(t[1]) || used.has(t[0]) || used.has(t[1])) continue;
          used.add(t[0]); used.add(t[1]);
          const old = s.teams.find((x) => x.p.includes(t[0]) && x.p.includes(t[1]));
          teams.push({ id: old ? old.id : ctx.id(6), p: [t[0], t[1]] });
        }
        s.teams = teams; markDirty(s); r = { ok: true }; break;
      }
      case 'draw': {
        if (s.phase === 'done') return err('종료된 모임입니다.');
        const n = s.players.filter((p) => p.present).length;
        if (s.mode === 'rotation' && n < 4) return err('참석자가 4명 이상이어야 대진을 짤 수 있습니다.');
        if (s.mode === 'fixed' && s.teams.filter((t) => t.p.every((id) => (P(id) || {}).present)).length < 2) return err('팀이 2개 이상 있어야 합니다.');
        if (a.fresh && s.phase !== 'live') s.rounds = [];
        draw(s, ctx); r = { ok: true }; break;
      }
      case 'start':
        if (!s.rounds.length) return err('먼저 대진을 짜세요.');
        s.phase = 'live'; s.startedAt = s.startedAt || ctx.now; assign(s, ctx); r = { ok: true }; break;
      case 'score': r = score(s, a, ctx); break;
      case 'voidMatch': {
        const m = findMatch(s, a.mid); if (!m) return err('없는 경기입니다.');
        if (m.state === 'done') return err('결과가 들어간 경기는 취소할 수 없습니다. 점수를 고치세요.');
        m.state = 'void'; assign(s, ctx); r = { ok: true }; break;
      }
      case 'finish': s.phase = 'done'; s.finishedAt = ctx.now; r = { ok: true }; break;
      case 'reopen': s.phase = 'live'; assign(s, ctx); r = { ok: true }; break;
      case 'reset':
        if (s.phase === 'live' || s.phase === 'done') {
          if (allMatches(s).some((m) => m.state === 'done') && !a.force) return err('결과가 있는 경기는 지울 수 없습니다.');
        }
        s.rounds = []; s.phase = 'rsvp'; s.dirty = false; r = { ok: true }; break;
      default: return err('알 수 없는 요청입니다.');
    }
    if (r && !r.error) s.v = (s.v || 0) + 1;
    return r;
  }

  function rsvp(s, a, ctx) {
    if (s.phase === 'done') return err('이미 종료된 모임입니다.');
    const name = str(a.name, 16);
    let p = a.pid ? s.players.find((x) => x.id === a.pid) : null;
    if (!p && name) {
      const same = s.players.find((x) => x.name === name);
      if (same) {
        // 같은 이름: 호스트가 미리 넣어 둔 이름이거나, 같은 폰이면 본인으로 보고 이어 씀
        if (!same.dev || same.dev === ctx.dev) p = same;
        else return err(`${name} 님은 이미 다른 폰에서 응답했습니다. 이름 뒤에 구분할 글자를 붙여 주세요.`);
      }
    }
    if (!p) {
      if (!name) return err('이름을 입력하세요.');
      p = { id: ctx.id(6), name, level: '', levelSelf: false, status: 'yes', src: 'invite', present: false, dev: '' };
      s.players.push(p);
      if (a.status === undefined) a.status = 'yes';
    }
    if (ctx.dev && !p.dev) p.dev = ctx.dev;
    if (a.level !== undefined) { p.level = cleanLevel(s.sport, a.level); p.levelSelf = !!a.levelSelf; }
    if (a.status === 'yes' || a.status === 'no') {
      p.status = a.status;
      const was = p.present;
      p.present = a.status === 'yes';
      if (was !== p.present) markDirty(s);
    }
    return { ok: true, pid: p.id };
  }

  function settings(s, a) {
    const f = a.fields || {};
    if (f.title !== undefined) s.title = str(f.title, 40) || s.title;
    if (f.date !== undefined) s.date = str(f.date, 20);
    if (f.place !== undefined) s.place = str(f.place, 40);
    if (f.note !== undefined) s.note = str(f.note, 200);
    if (f.sport && SPORTS[f.sport] && f.sport !== s.sport) {
      const was = SPORTS[s.sport];
      s.sport = f.sport;
      if (s.target === was.target) s.target = SPORTS[f.sport].target;
      if (s.minutes === was.minutes) s.minutes = SPORTS[f.sport].minutes;
      s.players.forEach((p) => { p.level = ''; p.levelSelf = false; }); // 급수 ↔ DUPR 은 호환 안 됨
      markDirty(s);
    }
    if (f.courts !== undefined) { s.courts = clampInt(f.courts, 1, 8, s.courts); markDirty(s); }
    if (f.mode && (f.mode === 'fixed' || f.mode === 'rotation') && f.mode !== s.mode) {
      if (s.phase === 'live' || s.phase === 'done') return err('경기 중에는 방식을 바꿀 수 없습니다.');
      s.mode = f.mode; s.rounds = []; s.phase = 'rsvp'; s.dirty = false;
    }
    if (f.target !== undefined) s.target = clampInt(f.target, 5, 31, s.target);
    if (f.minutes !== undefined) s.minutes = clampInt(f.minutes, 5, 40, s.minutes);
    if (f.balanceLevel !== undefined) { s.balanceLevel = !!f.balanceLevel; markDirty(s); }
    if (f.totalRounds !== undefined) { s.totalRounds = f.totalRounds == null ? null : clampInt(f.totalRounds, 1, 40, null); markDirty(s); }
    return { ok: true };
  }

  function score(s, a, ctx) {
    if (s.phase !== 'live' && !(ctx.isHost && s.phase === 'done')) return err('경기 중일 때만 결과를 넣을 수 있습니다.');
    const m = findMatch(s, a.mid);
    if (!m) return err('없는 경기입니다.');
    if (m.state === 'void') return err('취소된 경기입니다.');
    if (m.state === 'wait' && !ctx.isHost) return err('아직 시작하지 않은 경기입니다.');
    const sa = parseInt(a.sa, 10), sb = parseInt(a.sb, 10);
    if (!isFinite(sa) || !isFinite(sb) || sa < 0 || sb < 0 || sa > 99 || sb > 99) return err('점수를 확인해 주세요.');
    if (sa === sb) return err('동점은 입력할 수 없습니다. 이긴 팀을 정해 주세요.');
    if (!ctx.isHost && a.by && !playersOf(m).includes(a.by)) return err('이 경기에 뛴 사람만 결과를 넣을 수 있습니다.');
    const wasDone = m.state === 'done';
    // 같은 코트 사람들이 거의 동시에 누른 경우: 먼저 들어간 결과를 지키고, 고치기는 명시적으로만
    if (wasDone && !a.edit) {
      const who = m.by === 'host' ? '호스트' : ((s.players.find((p) => p.id === m.by) || {}).name || '다른 사람');
      return err(`${who} 님이 이미 결과를 넣었습니다 (${m.sa}:${m.sb}). 틀렸다면 기록에서 눌러 고쳐 주세요.`);
    }
    m.sa = sa; m.sb = sb; m.state = 'done'; m.by = a.by || (ctx.isHost ? 'host' : ''); m.at = ctx.now;
    if (wasDone) m.edited = true;
    if (!m.court) m.court = 1;
    assign(s, ctx);
    return { ok: true };
  }

  // ---------- 화면용 요약 ----------
  // 참가자 한 명의 시점: 지금 경기, 다음 경기, 쉬는 중인지
  function myView(s, pid) {
    const name = (id) => (s.players.find((p) => p.id === id) || { name: '?' }).name;
    const ms = allMatches(s).filter((m) => m.state !== 'void' && playersOf(m).includes(pid));
    const done = ms.filter((m) => m.state === 'done');
    const pending = ms.filter((m) => m.state !== 'done');
    const side = (m) => (m.a.includes(pid) ? 'a' : 'b');
    const describe = (m) => {
      const my = m[side(m)], op = m[side(m) === 'a' ? 'b' : 'a'];
      return { id: m.id, round: m.ri + 1, court: m.court, state: m.state, side: side(m),
        partner: my.find((x) => x !== pid), opponents: op, match: m };
    };
    const current = pending.find((m) => m.state === 'play');
    const next = pending.find((m) => m.state === 'wait');
    let wait = null;
    if (!current && next) {
      // 왜 아직 못 하는지: 같이 뛸 사람이 다른 코트에서 경기 중이거나, 코트가 꽉 찼거나, 라운드 차례가 아님
      const playing = allMatches(s).filter((m) => m.state === 'play');
      const busy = new Map();
      playing.forEach((m) => playersOf(m).forEach((p) => busy.set(p, m.court)));
      const blockers = playersOf(next).filter((p) => p !== pid && busy.has(p)).map((p) => ({ id: p, name: name(p), court: busy.get(p) }));
      const fr = frontRound(s);
      const resting = next.ri > fr + 1 || (fr >= 0 && (s.rounds[fr].rest || []).includes(pid) && next.ri > fr);
      wait = { blockers, courtsFull: playing.length >= s.courts, resting, ahead: Math.max(0, next.ri - Math.max(fr, 0)) };
    }
    let w = 0, l = 0, pf = 0, pa = 0;
    done.forEach((m) => {
      const mine = side(m) === 'a' ? m.sa : m.sb, theirs = side(m) === 'a' ? m.sb : m.sa;
      pf += mine; pa += theirs; if (mine > theirs) w++; else l++;
    });
    return {
      current: current ? describe(current) : null,
      next: next ? describe(next) : null,
      after: pending.filter((m) => m !== current && m !== next).slice(0, 2).map(describe),
      wait, record: { w, l, g: done.length, diff: pf - pa }, remaining: pending.length,
      history: done.map(describe),
    };
  }

  // 전체 코트 현황과 다음 대기 경기들
  function boardView(s) {
    const courts = [];
    for (let c = 1; c <= s.courts; c++) courts.push({ court: c, match: null });
    const playing = allMatches(s).filter((m) => m.state === 'play');
    playing.forEach((m) => { const slot = courts.find((x) => x.court === m.court); if (slot && !slot.match) slot.match = m; else courts.push({ court: m.court, match: m }); });
    const queue = allMatches(s).filter((m) => m.state === 'wait');
    const done = allMatches(s).filter((m) => m.state === 'done');
    return { courts, queue, doneCount: done.length, total: done.length + queue.length + playing.length };
  }

  // 남에게 보낼 때 호스트 키와 기기 식별값은 뺀다
  function publicState(s, isHost) {
    const c = JSON.parse(JSON.stringify(s));
    if (!isHost) delete c.hostKey;
    c.players.forEach((p) => { p.claimed = !!p.dev; delete p.dev; });
    return c;
  }

  const Core = {
    SPORTS, GRADES, SELF_DUPR, levelLabel, levelNum, cleanLevel, makeLevelOf,
    newEvent, apply, assign, myView, boardView, publicState, allMatches, findMatch, totalRounds, frontRound,
    standings: (s) => Engine.standings(s),
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = Core;
  else root.Core = Core;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
(function () {
'use strict';

/* ▼ 배포 후 앱스크립트 웹 앱 주소(…/exec)를 따옴표 안에 넣으세요 */
const API_URL = 'https://script.google.com/macros/s/AKfycby_TFP5XxvTlMdr7TEh4IDVIsXYfuhbtukYqQ5h_URdpgEsfwyFDlNTYHtn9PuTXOMN/exec';

const QS = new URLSearchParams(location.search);
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const API = (LOCAL && QS.get('api')) || API_URL;
const POLL_MS = 4000;

// ---------- 저장 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const DEV = store.get('oc:dev') || (() => { const d = 'd' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-3); store.set('oc:dev', d); return d; })();
const mem = () => store.get('oc:events', {});
function remember(id, patch) { const m = mem(); m[id] = Object.assign({}, m[id] || {}, patch, { seen: Date.now() }); store.set('oc:events', m); }

// ---------- 상태 ----------
const A = {
  eid: QS.get('e'), k: null, pid: null, s: null, v: 0,
  tab: (location.hash || '').slice(1) || null, sheet: null, net: 'ok', busy: null,
  armed: null, drafts: {}, watch: false, loaded: false, err: null, formErr: {},
};
if (A.eid) {
  const m = mem()[A.eid] || {};
  A.k = QS.get('k') || m.k || null;
  A.pid = m.pid || null;
  A.watch = !!m.watch;
  if (QS.get('k')) { remember(A.eid, { k: A.k, role: 'host' }); history.replaceState(null, '', location.pathname + '?e=' + encodeURIComponent(A.eid) + (LOCAL && QS.get('api') ? '&api=' + encodeURIComponent(QS.get('api')) : '') + location.hash); }
}

const DF = new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
function fmtDate(v) {
  if (!v) return '';
  const hasTime = v.includes('T');
  const d = new Date(hasTime ? v : v + 'T00:00');
  return isNaN(d) ? v : (hasTime ? DTF : DF).format(d);
}
const NF = new Intl.NumberFormat('ko-KR');
function fmtMin(m) { const h = Math.floor(m / 60), r = m % 60; return h ? `${h}시간${r ? ' ' + r + '분' : ''}` : `${r}분`; }
function ago(ts) { const m = Math.max(0, Math.round((Date.now() - ts) / 60000)); return m < 1 ? '방금 시작' : `${m}분째`; }

// ---------- 서버 통신 ----------
async function getState() {
  const u = new URL(API);
  u.searchParams.set('a', 'state'); u.searchParams.set('e', A.eid);
  if (A.v) u.searchParams.set('v', A.v);
  if (A.k) u.searchParams.set('k', A.k);
  const r = await fetch(u, { cache: 'no-store' });
  return r.json();
}
async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
async function act(action, busyKey) {
  A.busy = busyKey || action.type; render();
  try {
    const r = await post({ a: 'act', e: A.eid, k: A.k, dev: DEV, action });
    A.busy = null;
    if (r.error) { toast(r.error, true); render(); poll(); return r; }
    A.net = 'ok';
    setState(r.state);
    return r;
  } catch (e) {
    A.busy = null; A.net = 'down';
    toast('연결이 끊겼습니다. 와이파이나 데이터를 확인하고 다시 눌러 주세요.', true);
    render(); return { error: 'net' };
  }
}

let pollTimer = null;
async function poll() {
  clearTimeout(pollTimer);
  if (!A.eid || !API) return;
  if (document.visibilityState === 'visible') {
    try {
      const r = await getState();
      if (r.error) { A.err = r.error; A.loaded = true; render(); return; }
      A.net = 'ok';
      if (!r.same) setState(r.state); else if (A.netWas !== A.net) render();
    } catch (e) { A.net = 'down'; render(); }
    A.netWas = A.net;
  }
  pollTimer = setTimeout(poll, POLL_MS);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });

function setState(s) {
  const prevMine = A.s && A.pid ? JSON.stringify(Core.myView(A.s, A.pid).current && Core.myView(A.s, A.pid).current.id) : null;
  A.s = s; A.v = s.v; A.loaded = true; A.err = null;
  if (!A.pid && isHost()) { const h = s.players.find((p) => p.src === 'host'); if (h && mem()[A.eid] && mem()[A.eid].hostPid === h.id) A.pid = h.id; }
  if (A.pid && !byId(A.pid)) A.pid = null;
  remember(A.eid, { title: s.title, date: s.date, sport: s.sport, pid: A.pid });
  // 내 코트가 새로 배정되면 진동으로 알림 (지원하는 폰만)
  if (A.pid && prevMine !== null) {
    const v = Core.myView(s, A.pid);
    const now = JSON.stringify(v.current && v.current.id);
    if (now !== prevMine && v.current && navigator.vibrate) navigator.vibrate([120, 60, 120]);
  }
  render();
}

function toast(msg, bad) {

  t.textContent = msg; t.classList.toggle('bad', !!bad); t.setAttribute('data-show', '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.removeAttribute('data-show'), bad ? 4200 : 2200);
}

}
