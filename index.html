      <div class="row" style="padding:12px 0 0;border:0"><span class="lbl">내 실력 표기<span class="hint">대진 균형에만 쓰입니다</span></span><button class="lv press${lvl(p) ? '' : ' unset'}" data-act="lv-open" data-id="${p.id}" data-self="1">${esc(lvl(p) || (SP().levelKind === 'grade' ? '급수' : 'DUPR'))}</button></div>
    </section>
    <section class="block"><h2>참석자 <small>${NF.format(yes.length)}명</small></h2><div class="chips">${yes.map((x) => `<span class="chip static">${esc(x.name)}${lvl(x) ? `<small>${esc(lvl(x))}</small>` : ''}</span>`).join('')}</div></section>`;
    $view.innerHTML = html;
    dock(p.present ? `<button class="secondary press" style="flex:1" data-act="rsvp-me" data-v="no">불참으로 바꾸기</button>` : `<button class="primary press" data-act="rsvp-me" data-v="yes">참석으로 바꾸기</button>`);
    return;
  }

  // 경기 중
  if (v.current) {
    const c = v.current;
    html += `<section class="hero play" aria-live="polite"><div class="hero-top"><div><p class="hero-k">지금 내 경기</p><h2>${c.round}라운드</h2></div>
        <div class="hero-court" aria-label="${c.court}코트"><span class="num">${c.court}</span><span class="unit">코트</span></div></div>
      ${courtGraphic(c.match, { pid: A.pid })}
      <p class="elapsed">${ago(c.match.startAt)}</p></section>`;
  } else if (v.next) {
    const n = v.next, w = v.wait;
    let why;
    if (w.resting) why = '<b>이번 차례는 쉬는 순서입니다.</b> 앞 경기가 끝나면 이어서 들어갑니다.';
    else if (w.blockers.length) why = `<b>${w.blockers.map((b) => `${esc(b.name)} 님(${b.court}코트)`).join(', ')}</b> 경기가 끝나면 바로 시작합니다.`;
    else if (w.courtsFull) why = '<b>코트가 비면 바로 시작합니다.</b> 근처에서 기다려 주세요.';
    else why = '<b>곧 코트가 배정됩니다.</b>';
    html += `<section class="hero" aria-live="polite"><div class="hero-top"><div><p class="hero-k">다음 경기</p><h2>${n.round}라운드 대기</h2></div></div>
      <p class="why">${why}</p>
      <dl class="vs"><dt>짝</dt><dd>${esc(nm(n.partner))}</dd><dt>상대</dt><dd>${n.opponents.map(nm).map(esc).join(', ')}</dd></dl></section>`;
  } else if (p.present) {
    html += `<section class="hero"><p class="hero-k">오늘 내 경기</p><h2>모두 끝났습니다. 수고하셨습니다</h2><p class="summary">다른 코트 결과가 다 들어오면 호스트가 순위를 확정합니다.</p></section>`;
  }
  html += `<div class="recline"><span><b>${v.record.w}</b>승</span><span><b>${v.record.l}</b>패</span><span><b>${signed(v.record.diff)}</b>득실</span><span><b>${v.remaining}</b>경기 남음</span></div>`;
  if (v.after.length) html += `<section class="block"><h2>그다음 경기</h2><ul class="panel list">${v.after.map((x) => `<li><span>${x.round}라운드</span><span>짝 ${esc(nm(x.partner))}, 상대 ${x.opponents.map(nm).map(esc).join(', ')}</span></li>`).join('')}</ul></section>`;
  if (v.history.length) html += `<section class="block"><h2>내 경기 기록</h2><ul class="panel list">${v.history.slice().reverse().map((x) => {
    const m = x.match, mine = x.side === 'a' ? m.sa : m.sb, th = x.side === 'a' ? m.sb : m.sa;
    return `<li><span>${x.round}R ${mine > th ? '승' : '패'} ${mine}:${th}</span><span>짝 ${esc(nm(x.partner))}</span></li>`;
  }).join('')}</ul></section>`;
  $view.innerHTML = html;
  if (v.current) dock(`<button class="primary press" data-act="score-open" data-mid="${v.current.id}">경기 끝, 결과 입력</button>`);
  else if (!p.present) dock(`<button class="primary press" data-act="rsvp-me" data-v="yes">참석으로 바꾸기</button>`);
  else dock(`<button class="secondary press" style="flex:1" data-act="tab" data-tab="courts">코트 현황 보기</button>`);
}

// ----- 코트 현황 (참가자·관전자·호스트 공통) -----
function boardHtml(tappable) {
  const s = S(), b = Core.boardView(s);
  const fr = Core.frontRound(s);
  const playingIds = new Map();
  b.courts.forEach((c) => c.match && c.match.a.concat(c.match.b).forEach((p) => playingIds.set(p, c.court)));
  const courts = b.courts.map((c) => {
    if (!c.match) return `<div class="cwrap"><div class="clabel"><b>${c.court}코트</b><span>비어 있음</span></div><div class="court empty">다음 경기 준비 중</div></div>`;
    const m = c.match;
    const g = courtGraphic(m, { pid: A.pid });
    return `<div class="cwrap"><div class="clabel"><b>${c.court}코트</b><span>${m.ri + 1}라운드, ${ago(m.startAt)}</span></div>
      ${tappable ? `<button class="tap press" data-act="score-open" data-mid="${m.id}" aria-label="${c.court}코트 결과 입력">${g}</button>` : g}</div>`;
  }).join('');
  const queue = b.queue.slice(0, 6).map((m) => {
    const blockers = m.a.concat(m.b).filter((p) => playingIds.has(p));
    const later = m.ri > fr + 1;
    const cs = [...new Set(blockers.map((p) => playingIds.get(p)))].sort();
    const why = later ? `${m.ri + 1}라운드 차례를 기다리는 중` : cs.length ? `${cs.join('·')}코트 경기가 끝나면 시작` : '코트가 비면 바로 시작';
    return `<li><span>${m.ri + 1}R</span><span><span class="q-who">${m.a.map(nm).map(esc).join(' · ')} 대 ${m.b.map(nm).map(esc).join(' · ')}</span><span class="q-why">${why}</span></span></li>`;
  }).join('');
  return `<div class="courts">${courts}</div>
    <section class="block"><h2>다음 차례 <small>${NF.format(b.doneCount)} / ${NF.format(b.total)}경기 끝</small></h2>
      ${queue ? `<ul class="panel list queue">${queue}</ul>` : `<div class="note">남은 대기 경기가 없습니다.</div>`}</section>`;
}

function renderCourts() {
  const s = S();
  if (s.phase === 'rsvp' || s.phase === 'ready') {
    $view.innerHTML = `<div class="empty"><b>${s.phase === 'ready' ? '대진은 나왔고, 곧 시작합니다' : '아직 참석을 받는 중입니다'}</b>경기가 시작되면 코트별 현황이 여기에 뜹니다.</div>`;
    dock(!A.pid && !isHost() ? `<button class="primary press" data-act="unwatch">참석 응답하기</button>` : ''); return;
  }
  $view.innerHTML = boardHtml(isHost());
  dock(!A.pid && !isHost() && s.phase !== 'done' ? `<button class="primary press" data-act="unwatch">나도 참석하기</button>` : '');
}

// ----- 순위 -----
function renderRank() {
  const s = S();
  const list = Core.standings(s);
  const scored = Core.allMatches(s).some((m) => m.state === 'done');
  const fixed = s.mode === 'fixed';
  const myTeam = fixed && A.pid ? (s.teams.find((t) => t.p.includes(A.pid)) || {}).id : A.pid;
  let podium = '';
  if (s.phase === 'done' && scored) {
    const top = list.filter((r) => r.g > 0).slice(0, 3);
    const order = [top[1], top[0], top[2]], cls = ['s', 'g', 'b'];
    podium = `<div class="podium">${order.map((r, i) => r ? `<div class="pod ${cls[i]}"><div class="medal">${r.rank}</div><div class="who">${esc(r.name)}</div><div class="rec">${r.w}승 ${r.l}패<br>득실 ${signed(r.diff)}</div></div>` : '<div></div>').join('')}</div>`;
  }
  const rows = list.filter((r) => r.g > 0).map((r) => `<tr class="${r.rank <= 3 ? 'top3' : ''}${r.id === myTeam ? ' me' : ''}"><td>${r.rank}</td><td>${esc(r.name)}</td><td>${r.g}</td><td>${r.w}-${r.l}</td><td>${signed(r.diff)}</td><td>${Math.round(r.rate * 100)}%</td></tr>`).join('');
  $view.innerHTML = `${podium}
    ${scored ? `<div class="tbl-wrap"><table><caption class="vh">${s.phase === 'done' ? '최종 순위' : '현재 순위'}</caption><thead><tr><th scope="col">순위</th><th scope="col">${fixed ? '팀' : '이름'}</th><th scope="col">경기</th><th scope="col">승-패</th><th scope="col">득실</th><th scope="col">승률</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="summary">${s.phase === 'done' ? '최종 순위입니다.' : '경기 중 순위는 계속 바뀝니다.'} 승률, 득실차, 득점 순으로 정하므로 늦게 온 사람도 공정하게 비교됩니다.</p>`
      : `<div class="empty"><b>아직 결과가 없습니다</b>경기 결과가 들어오면 순위가 여기에 쌓입니다.</div>`}`;
  if (isHost()) dock(s.phase === 'done' ? `<button class="secondary press" style="flex:1" data-act="reopen">경기 다시 열기</button>` : s.phase === 'live' ? finishBtn() : '');
  else dock('');
}

// ----- 호스트: 진행 -----
function finishBtn() {
  const left = Core.allMatches(S()).filter((m) => m.state === 'play').length;
  const label = A.armed === 'finish' ? (left ? `진행 중 ${left}경기는 빼고 종료합니다. 한 번 더 누르세요` : '한 번 더 누르면 종료합니다') : '경기 종료하고 순위 확정';
  return `<button class="primary press${A.armed === 'finish' ? ' armed' : ''}" data-act="finish">${busyLabel('finish', label, '종료하는 중…')}</button>`;
}
function renderRun() {
  const s = S();
  let html = '';
  if (s.dirty) html += `<div class="banner" role="status"><span>명단이나 설정이 바뀌었습니다. 아직 시작 안 한 경기부터 다시 짤까요?</span><button class="press" data-act="draw">${busyLabel('draw', '다시 짜기', '짜는 중…')}</button></div>`;
  if (s.phase === 'rsvp') {
    $view.innerHTML = html + `<div class="empty"><b>아직 대진이 없습니다</b>명단 탭에서 참석자를 확인하고 대진을 짜세요.</div>`;
    dock(`<button class="primary press" data-act="tab" data-tab="roster">명단 확인하러 가기</button>`); return;
  }
  if (s.phase === 'ready') {
    const r1 = s.rounds[0];
    html += `<section class="block"><h2>1라운드 미리 보기 <small>총 ${s.rounds.length}라운드</small></h2><div class="courts">${r1.matches.map((m) => `<div class="cwrap"><div class="clabel"><b>${m.court}코트</b></div>${courtGraphic(m)}</div>`).join('')}</div>
      ${r1.rest && r1.rest.length ? `<p class="summary">쉬는 사람: ${r1.rest.map(nm).map(esc).join(', ')}</p>` : ''}</section>`;
    $view.innerHTML = html;
    dock(`<button class="primary press" data-act="start" ${A.busy ? 'disabled' : ''}>${busyLabel('start', '경기 시작', '시작하는 중…')}</button>`); return;
  }
  if (A.pid && s.phase === 'live') {
    const v = Core.myView(s, A.pid);
    if (v.current) html += `<div class="note"><b>내 경기: ${v.current.court}코트</b> 짝 ${esc(nm(v.current.partner))}</div>`;
    else if (v.next) html += `<div class="note"><b>내 다음 경기: ${v.next.round}라운드</b> 짝 ${esc(nm(v.next.partner))}</div>`;
  }
  html += boardHtml(true);
  const recent = Core.allMatches(s).filter((m) => m.state === 'done').sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 6);
  if (recent.length) html += `<section class="block"><h2>최근 결과 <small>눌러서 고치기</small></h2><ul class="panel list queue">${recent.map((m) => `<li><span>${m.ri + 1}R ${m.court}코트</span><span><button class="linkbtn" data-act="score-open" data-mid="${m.id}">${m.a.map(nm).map(esc).join(' · ')} ${m.sa}:${m.sb} ${m.b.map(nm).map(esc).join(' · ')}</button>${m.by ? `<span class="q-why">${m.by === 'host' ? '호스트' : esc(nm(m.by))} 입력${m.edited ? ', 수정됨' : ''}</span>` : ''}</span></li>`).join('')}</ul></section>`;
  $view.innerHTML = html;
  dock(s.phase === 'done' ? `<button class="secondary press" style="flex:1" data-act="reopen">경기 다시 열기</button>` : finishBtn());
}

// ----- 호스트: 명단 -----
function renderRoster() {
  const s = S(), R = Engine.recommendRounds(s.players.filter((p) => p.present).length, s.courts);
  const isRot = s.mode === 'rotation', live = s.phase === 'live' || s.phase === 'done';
  const n = s.players.filter((p) => p.present).length;
  let summary;
  if (isRot && R.used) {
    const tr = Core.totalRounds(s), each = (tr * R.used * 4 / n).toFixed(1);
    summary = `한 번에 <b>${R.used * 4}명</b>이 뛰고 <b>${R.perRoundRest}명</b>이 쉽니다. <b>${tr}라운드</b>면 1인당 약 <b>${each}경기</b>, 예상 <b>${fmtMin(tr * s.minutes)}</b>.${s.totalRounds ? '' : ' 모두가 한 번씩 짝이 되는 추천값입니다.'}`;
  } else if (!isRot) {
    const T = s.teams.length, games = T * (T - 1) / 2, C = Math.min(s.courts, Math.floor(T / 2)) || 1;
    summary = T >= 2 ? `<b>${T}팀</b> 리그전, 총 <b>${games}경기</b>, 예상 <b>${fmtMin(Math.ceil(games / C) * s.minutes)}</b>.` : '아래에서 두 사람씩 눌러 팀을 만드세요.';
  } else summary = '참석자가 4명 이상이면 대진을 짤 수 있습니다.';

  const players = s.players.slice().sort((a, b) => (b.present - a.present)).map((p) => {
    const src = p.src === 'walkin' ? '현장 추가' : p.src === 'host' ? '호스트' : (p.status === 'no' ? '불참 응답' : p.claimed ? '참석 응답' : '응답 대기');
    return `<div class="player${p.present ? '' : ' off'}">
      <button class="check press" data-act="present" data-id="${p.id}" aria-pressed="${p.present}" aria-label="${esc(p.name)} 오늘 참석"></button>
      <span class="pname">${esc(p.name)}<small>${src}</small></span>
      <button class="lv press${lvl(p) ? '' : ' unset'}" data-act="lv-open" data-id="${p.id}" aria-label="${esc(p.name)} 실력 표기 바꾸기">${esc(lvl(p) || (SP().levelKind === 'grade' ? '급수' : 'DUPR'))}</button>
      <button class="del press${A.armed === 'del:' + p.id ? ' armed' : ''}" data-act="del" data-id="${p.id}" aria-label="${esc(p.name)} 명단에서 빼기">${A.armed === 'del:' + p.id ? '한 번 더' : '×'}</button>
    </div>`;
  }).join('');

  let teamsHtml = '';
  if (!isRot) {
    const inTeam = new Set(s.teams.flatMap((t) => t.p));
    const free = s.players.filter((p) => p.present && !inTeam.has(p.id));
    teamsHtml = `<section class="block"><h2>팀 <small>${s.teams.length}팀</small></h2><div class="panel">
      ${s.teams.map((t, i) => `<div class="team"><b>${i + 1}팀 ${t.p.map(nm).map(esc).join(' · ')}</b><button class="del press" data-act="unteam" data-i="${i}" aria-label="${i + 1}팀 풀기">×</button></div>`).join('')}
      <div class="field"><span style="font-size:13px;color:var(--muted)">두 사람을 차례로 누르면 한 팀이 됩니다</span><div class="chips">${free.map((p) => `<button class="chip press" data-act="pick" data-id="${p.id}" aria-pressed="${A.drafts.pick === p.id}">${esc(p.name)}${lvl(p) ? `<small>${esc(lvl(p))}</small>` : ''}</button>`).join('') || '<span class="hint">팀이 없는 참석자가 없습니다.</span>'}</div></div>
      ${free.length >= 2 ? `<div class="row"><span class="lbl">남은 사람 자동으로 짝 짓기<span class="hint">실력이 높은 사람과 낮은 사람을 묶습니다</span></span><button class="secondary small press" data-act="autoteam">짝 짓기</button></div>` : ''}
    </div></section>`;
  }

  const t = s.date && s.date.includes('T') ? s.date.split('T') : [s.date || '', ''];
  $view.innerHTML = `
    ${s.dirty ? `<div class="banner" role="status"><span>바뀐 내용을 반영하려면 대진을 다시 짜세요.</span><button class="press" data-act="draw">${busyLabel('draw', '다시 짜기', '짜는 중…')}</button></div>` : ''}
    <section class="block"><h2>참가자 <small>참석 ${NF.format(n)}명 / 전체 ${NF.format(s.players.length)}명</small></h2><div class="panel">
      <form class="add" id="addForm" novalidate><label class="vh" for="r-name">현장에 온 사람 이름</label><input class="in" id="r-name" name="walkin" autocomplete="off" spellcheck="false" maxlength="16" placeholder="현장에 온 사람 이름…" value="${esc(draft('r-name'))}" data-draft><button class="press">${busyLabel('addPlayer', '추가', '추가 중…')}</button></form>
      ${players || '<div class="empty"><b>아직 참가자가 없습니다</b>초대 탭에서 링크를 보내거나 위 칸에 이름을 넣으세요.</div>'}
    </div></section>
    ${teamsHtml}
    <section class="block"><h2>경기 설정</h2><div class="panel">
      <div class="row"><span class="lbl">종목${live ? '' : '<span class="hint">바꾸면 실력 표기는 지워집니다</span>'}</span><div class="seg" role="group" aria-label="종목">
        ${Object.entries(Core.SPORTS).map(([k, v]) => `<button class="press" data-act="set" data-f="sport" data-v="${k}" aria-pressed="${s.sport === k}" ${live ? 'disabled' : ''}>${v.label}</button>`).join('')}</div></div>
      <div class="row"><span class="lbl">방식<span class="hint">${isRot ? '경기마다 짝이 바뀌고 개인 순위' : '정해진 짝으로 팀 리그, 팀 순위'}</span></span><div class="seg" role="group" aria-label="방식">
        <button class="press" data-act="set" data-f="mode" data-v="rotation" aria-pressed="${isRot}" ${live ? 'disabled' : ''}>로테이션</button>
        <button class="press" data-act="set" data-f="mode" data-v="fixed" aria-pressed="${!isRot}" ${live ? 'disabled' : ''}>고정 복식</button></div></div>
      <div class="row"><span class="lbl">코트</span>${stepper('set-step', s.courts + '면', '코트 수', 'data-f="courts"')}</div>
      ${isRot ? `<div class="row"><span class="lbl">라운드<span class="hint">${s.totalRounds ? `추천 ${R.rounds}라운드, <button class="linkbtn" data-act="set" data-f="totalRounds" data-v="">추천값으로</button>` : '추천값'}</span></span>${stepper('set-step', Core.totalRounds(s), '라운드 수', 'data-f="totalRounds"')}</div>
      <div class="row"><label for="bal">실력 균형<span class="hint">양 팀 실력 합이 비슷하게 짭니다</span></label><input type="checkbox" class="toggle" id="bal" ${s.balanceLevel ? 'checked' : ''}></div>` : ''}
      <div class="row"><span class="lbl">목표 점수<span class="hint">2점 차 승리, 듀스 적용</span></span>${stepper('set-step', s.target + '점', '목표 점수', 'data-f="target"')}</div>
      <div class="row"><span class="lbl">경기당 시간<span class="hint">예상 시간 계산용</span></span>${stepper('set-step', s.minutes + '분', '경기당 시간', 'data-f="minutes"')}</div>
    </div><p class="summary">${summary}</p></section>
    <section class="block"><h2>모임 정보</h2><div class="panel">
      <div class="field"><label for="s-title">모임 이름</label><input class="in" id="s-title" name="title" autocomplete="off" maxlength="40" value="${esc(draft('s-title', s.title))}" data-draft data-save="title"></div>
      <div class="field"><label for="s-date">날짜와 시간</label><div class="two"><input class="in" type="date" id="s-date" name="date" value="${esc(t[0])}" data-save="date" aria-label="날짜"><input class="in" type="time" id="s-time" name="time" value="${esc(t[1])}" data-save="date" aria-label="시간"></div></div>
      <div class="field"><label for="s-place">장소</label><input class="in" id="s-place" name="place" autocomplete="off" maxlength="40" placeholder="예: 학교 테니스장…" value="${esc(draft('s-place', s.place))}" data-draft data-save="place"></div>
      <div class="field"><label for="s-note">초대장에 붙일 말</label><input class="in" id="s-note" name="note" autocomplete="off" maxlength="200" placeholder="예: 공은 준비되어 있습니다…" value="${esc(draft('s-note', s.note))}" data-draft data-save="note"></div>
    </div></section>
    ${s.rounds.length && !live ? `<section class="block"><button class="secondary press${A.armed === 'reset' ? ' armed' : ''}" style="width:100%" data-act="reset">${A.armed === 'reset' ? '한 번 더 누르면 대진을 지웁니다' : '대진 지우고 참석 받기로 돌아가기'}</button></section>` : ''}`;

  const canDraw = isRot ? n >= 4 : s.teams.filter((tm) => tm.p.every((id) => (byId(id) || {}).present)).length >= 2;
  if (s.phase === 'rsvp') dock(`<button class="primary press" data-act="draw" ${!canDraw || A.busy ? 'disabled' : ''}>${busyLabel('draw', canDraw ? '대진 짜기' : (isRot ? '4명 이상 참석해야 짤 수 있습니다' : '팀이 2개 이상 있어야 합니다'), '짜는 중…')}</button>`);
  else if (s.phase === 'ready') dock(s.dirty ? `<button class="primary press" data-act="draw">${busyLabel('draw', '대진 다시 짜기', '짜는 중…')}</button>` : `<button class="primary press" data-act="start" ${A.busy ? 'disabled' : ''}>${busyLabel('start', '경기 시작', '시작하는 중…')}</button>`);
  else if (s.phase === 'live') dock(s.dirty ? `<button class="primary press" data-act="draw">${busyLabel('draw', '남은 경기 다시 짜기', '짜는 중…')}</button>` : `<button class="secondary press" style="flex:1" data-act="tab" data-tab="run">진행 화면으로</button>`);
  else dock('');
}

// ----- 호스트: 초대 -----
function inviteUrl() { const u = new URL(location.href); u.search = '?e=' + encodeURIComponent(A.eid); u.hash = ''; if (LOCAL && QS.get('api')) u.searchParams.set('api', QS.get('api')); return u.toString(); }
function cohostUrl() { const u = new URL(inviteUrl()); u.searchParams.set('k', A.k); return u.toString(); }
function inviteText() {
  const s = S();
  return [`[${SP().label}] ${s.title}`, s.date ? fmtDate(s.date) : '', s.place || '', s.note || '', '', '참석 여부를 눌러 주세요.', inviteUrl()].filter((x, i, arr) => x !== '' || (i > 0 && arr[i - 1] !== '')).join('\n');
}
function renderInvite() {
  const s = S();
  const yes = s.players.filter((p) => p.present), no = s.players.filter((p) => p.status === 'no'), wait = s.players.filter((p) => !p.claimed && p.src !== 'walkin' && p.src !== 'host' && p.status !== 'no');
  $view.innerHTML = `
    <section class="block"><h2>초대 링크</h2><div class="panel">
      <div class="field"><label for="inv-text">보낼 메시지</label><textarea class="in" id="inv-text" rows="6" readonly style="resize:none;font-size:14px">${esc(inviteText())}</textarea></div>
      <div class="row" style="gap:8px;justify-content:flex-end"><button class="secondary small press" data-act="copy" data-what="text">메시지 복사</button>${navigator.share ? '<button class="secondary small press" data-act="share">공유하기</button>' : ''}</div>
    </div><p class="summary">카톡 단톡방에 붙여 넣으면 됩니다. 받은 사람이 링크를 열어 이름을 적고 참석을 누르면 명단에 바로 들어옵니다.</p></section>
    <section class="block"><h2>응답 현황 <small>참석 ${NF.format(yes.length)}, 불참 ${NF.format(no.length)}</small></h2><div class="panel">
      <div class="field"><span style="font-size:13px;color:var(--muted)">참석</span><div class="chips">${yes.map((p) => `<span class="chip static">${esc(p.name)}${lvl(p) ? `<small>${esc(lvl(p))}</small>` : ''}</span>`).join('') || '<span class="hint">아직 없습니다</span>'}</div></div>
      ${no.length ? `<div class="field"><span style="font-size:13px;color:var(--muted)">불참</span><div class="chips">${no.map((p) => `<span class="chip static">${esc(p.name)}</span>`).join('')}</div></div>` : ''}
      ${wait.length ? `<div class="field"><span style="font-size:13px;color:var(--muted)">미리 넣어 둔 이름 중 응답 대기</span><div class="chips">${wait.map((p) => `<span class="chip static">${esc(p.name)}</span>`).join('')}</div></div>` : ''}
    </div></section>
    <section class="block"><h2>공동 호스트</h2><div class="panel"><div class="row"><span class="lbl">호스트 링크<span class="hint">이 링크를 받은 사람은 명단 수정과 경기 종료를 할 수 있습니다</span></span><button class="secondary small press" data-act="copy" data-what="cohost">복사</button></div></div></section>`;
  dock(s.phase === 'rsvp' ? `<button class="primary press" data-act="tab" data-tab="roster">명단 확인하고 대진 짜기</button>` : '');
}

// ---------- 시트 (결과 입력, 실력 표기) ----------
let sheetOpen = false;
function openSheet(state) {
  A.sheet = state; renderSheet();
  const el = document.getElementById('sheet');
  el.hidden = false;
  document.querySelector('.app').inert = true; $dock.inert = true;
  requestAnimationFrame(() => requestAnimationFrame(() => el.setAttribute('data-open', '')));
  sheetOpen = true;
  setTimeout(() => { const b = document.querySelector('#sheetIn [data-autofocus]') || document.querySelector('#sheetIn button'); if (b) b.focus({ preventScroll: true }); }, 60);
}
function closeSheet(instant) {
  const el = document.getElementById('sheet');
  el.removeAttribute('data-open');
  A.sheet = null; sheetOpen = false;
  document.querySelector('.app').inert = false; $dock.inert = false;
  const done = () => { if (!A.sheet) { el.hidden = true; document.getElementById('sheetIn').innerHTML = ''; } };
  if (instant) done(); else setTimeout(done, 210);
}
function winScore(sh) {
  const s = S();
  if (sh.lose == null || !sh.deuce) return s.target;
  const w = sh.lose + 2, cap = SP().cap;
  return cap && w > cap ? cap : w;
}
function renderSheet() {
  if (!A.sheet || !S()) return;
  const sh = A.sheet, s = S(), box = document.getElementById('sheetIn');
  if (sh.type === 'score') {
    const m = Core.findMatch(s, sh.mid);
    if (!m) { closeSheet(); return; }
    const w = winScore(sh);
    const loserIds = sh.win ? m[sh.win === 'a' ? 'b' : 'a'] : null;
    const pad = Array.from({ length: s.target - 1 }, (_, i) => `<button class="press" data-act="sc-lose" data-v="${i}" aria-pressed="${!sh.deuce && sh.lose === i}" ${sh.win ? '' : 'disabled'}>${i}</button>`).join('');
    box.innerHTML = `
      <h3 id="sheetTitle">${m.court ? m.court + '코트 ' : ''}결과 입력${m.state === 'done' ? ' (수정)' : ''}</h3>
      <p class="big">이긴 팀을 고르고, 진 팀 점수를 누르세요</p>
      <div class="teampick" role="group" aria-label="이긴 팀">
        ${['a', 'b'].map((k) => `<button class="press" data-act="sc-win" data-v="${k}" aria-pressed="${sh.win === k}" ${k === 'a' ? 'data-autofocus' : ''}>${m[k].map(nm).map(esc).join(' · ')}${m[k].includes(A.pid) ? '<small>우리 팀</small>' : ''}</button>`).join('')}
      </div>
      ${sh.win ? `<div class="scoreline" aria-live="polite"><div><span class="w">${w}</span><small>이긴 팀</small></div><span class="sep">:</span><div><span>${sh.lose == null ? '–' : sh.lose}</span><small>${loserIds.map(nm).map(esc).join(' · ')}</small></div></div>` : ''}
      <h3>진 팀 점수</h3>
      <div class="pad">${pad}</div>
      <div class="deuce"><label for="sc-deuce" style="font-weight:500">듀스<span class="hint">${s.target - 1}:${s.target - 1} 이후 2점 차${SP().cap ? `, 최대 ${SP().cap}점` : ''}</span></label>
        ${sh.deuce ? stepper('sc-deuce-step', sh.lose, '듀스 진 팀 점수') : `<input type="checkbox" class="toggle" id="sc-deuce" ${sh.win ? '' : 'disabled'}>`}</div>
      <div class="sheet-actions">
        <button class="secondary press" style="flex:1" data-act="sheet-close">취소</button>
        <button class="primary press" style="flex:2" data-act="sc-save" ${sh.win && sh.lose != null && !A.busy ? '' : 'disabled'}>${busyLabel('score', '결과 저장', '저장하는 중…')}</button>
      </div>`;
  } else if (sh.type === 'level') {
    const p = byId(sh.pid);
    if (!p) { closeSheet(); return; }
    box.innerHTML = `
      <h3 id="sheetTitle">${esc(p.name)}</h3>
      <p class="big">${SP().levelKind === 'grade' ? '급수' : 'DUPR'} 표기</p>
      <form id="lvForm" novalidate>${levelField('lv', draft('lv-level'), draft('lv-self') === '1')}</form>
      <div class="sheet-actions">
        <button class="ghost press" data-act="lv-clear">지우기</button>
        <button class="secondary press" style="flex:1" data-act="sheet-close">취소</button>
        <button class="primary press" style="flex:2" data-act="lv-save">${busyLabel('lv', '저장', '저장하는 중…')}</button>
      </div>`;
  }
}

// ---------- 이벤트 ----------
function arm(key) {
  if (A.armed === key) { A.armed = null; return true; }
  A.armed = key; clearTimeout(arm.t); arm.t = setTimeout(() => { A.armed = null; render(); }, 3500);
  render(); return false;
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('복사했습니다.'); }
  catch (e) { const ta = document.getElementById('inv-text'); if (ta) { ta.focus(); ta.select(); } toast('길게 눌러 직접 복사해 주세요.', true); }
}

document.addEventListener('click', async (e) => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const link = e.target.closest('a[href^="?e="]');
  if (link && window.__ocGo) { e.preventDefault(); window.__ocGo(new URLSearchParams(link.getAttribute('href')).get('e')); return; }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const a = t.dataset.act, id = t.dataset.id, s = S();
  switch (a) {
    case 'tab': A.tab = t.dataset.tab; try { history.replaceState(null, '', '#' + A.tab); } catch (err) {} window.scrollTo(0, 0); render(); break;
    case 'c-sport': A.drafts['c-sport'] = t.dataset.v; render(); break;
    case 'c-courts': A.drafts['c-courts'] = Math.max(1, Math.min(8, +draft('c-courts', 2) + +t.dataset.d)); render(); break;
    case 'claim': A.drafts['j-claim'] = A.drafts['j-claim'] === id ? null : id; render(); break;
    case 'join': join(t.dataset.v); break;
    case 'watch': A.watch = true; remember(A.eid, { watch: true }); A.tab = 'courts'; render(); break;
    case 'unwatch': A.watch = false; remember(A.eid, { watch: false }); render(); break;
    case 'rsvp-me': { const r = await act({ type: 'rsvp', pid: A.pid, status: t.dataset.v }, 'rsvp'); if (!r.error) toast(t.dataset.v === 'yes' ? '참석으로 바꿨습니다.' : '불참으로 바꿨습니다.'); break; }
    case 'lv-pick': { const p = t.dataset.p; A.drafts[p + '-level'] = A.drafts[p + '-level'] === t.dataset.v ? '' : t.dataset.v; A.drafts[p + '-self'] = ''; render(); break; }
    case 'lv-self': { const p = t.dataset.p; const on = !(A.drafts[p + '-self'] === '1' && A.drafts[p + '-level'] === t.dataset.v); A.drafts[p + '-level'] = on ? t.dataset.v : ''; A.drafts[p + '-self'] = on ? '1' : ''; render(); break; }
    case 'lv-open': { const p = byId(id); A.drafts['lv-level'] = p.level || ''; A.drafts['lv-self'] = p.levelSelf ? '1' : ''; openSheet({ type: 'level', pid: id, self: t.dataset.self === '1' }); break; }
    case 'lv-clear': A.drafts['lv-level'] = ''; A.drafts['lv-self'] = ''; renderSheet(); break;
    case 'lv-save': {
      const lv = readLevel('lv'), sh = A.sheet;
      if (lv.level && SP().levelKind === 'dupr' && !Core.cleanLevel(s.sport, lv.level)) { toast('DUPR은 2.0에서 8.0 사이 숫자로 적어 주세요.', true); return; }
      const r = sh.self && !isHost() ? await act({ type: 'rsvp', pid: sh.pid, level: lv.level, levelSelf: lv.levelSelf }, 'lv') : await act({ type: 'setPlayer', pid: sh.pid, level: lv.level, levelSelf: lv.levelSelf }, 'lv');
      if (!r.error) { closeSheet(); toast('저장했습니다.'); }
      break;
    }
    case 'score-open': {
      const m = Core.findMatch(s, t.dataset.mid);
      const st = { type: 'score', mid: m.id, win: null, lose: null, deuce: false, edit: m.state === 'done' };
      if (m.state === 'done') { st.win = m.sa > m.sb ? 'a' : 'b'; st.lose = Math.min(m.sa, m.sb); st.deuce = Math.max(m.sa, m.sb) > s.target; }
      openSheet(st); break;
    }
    case 'sc-win': A.sheet.win = t.dataset.v; renderSheet(); break;
    case 'sc-lose': A.sheet.lose = +t.dataset.v; A.sheet.deuce = false; renderSheet(); break;
    case 'sc-deuce-step': { const cap = SP().cap; A.sheet.lose = Math.max(s.target - 1, Math.min((cap || 99) - 1, A.sheet.lose + +t.dataset.d)); renderSheet(); break; }
    case 'sc-save': {
      const sh = A.sheet, w = winScore(sh);
      const sa = sh.win === 'a' ? w : sh.lose, sb = sh.win === 'a' ? sh.lose : w;
      const r = await act({ type: 'score', mid: sh.mid, sa, sb, by: A.pid || undefined, edit: !!sh.edit }, 'score');
      closeSheet();
      if (!r.error) toast(sh.edit ? '결과를 고쳤습니다.' : '결과를 저장했습니다.');
      break;
    }
    case 'sheet-close': closeSheet(); break;
    case 'present': { const p = byId(id); act({ type: 'setPlayer', pid: id, present: !p.present }, 'present:' + id); break; }
    case 'del': if (arm('del:' + id)) act({ type: 'removePlayer', pid: id }); break;
    case 'pick': {
      if (!A.drafts.pick) { A.drafts.pick = id; render(); }
      else if (A.drafts.pick === id) { A.drafts.pick = null; render(); }
      else { const teams = s.teams.map((x) => x.p).concat([[A.drafts.pick, id]]); A.drafts.pick = null; act({ type: 'setTeams', teams }); }
      break;
    }
    case 'unteam': act({ type: 'setTeams', teams: s.teams.filter((_, i) => i !== +t.dataset.i).map((x) => x.p) }); break;
    case 'autoteam': {
      const inTeam = new Set(s.teams.flatMap((x) => x.p));
      const lv = Core.makeLevelOf(s);
      const free = s.players.filter((p) => p.present && !inTeam.has(p.id)).sort((x, y) => lv(y.id) - lv(x.id));
      const teams = s.teams.map((x) => x.p);
      while (free.length >= 2) teams.push([free.shift().id, free.pop().id]);
      act({ type: 'setTeams', teams }); break;
    }
    case 'set': {
      const f = t.dataset.f, v = t.dataset.v;
      act({ type: 'settings', fields: { [f]: f === 'totalRounds' ? null : v } }); break;
    }
    case 'set-step': {
      const f = t.dataset.f, d = +t.dataset.d;
      const cur = f === 'totalRounds' ? Core.totalRounds(s) : s[f];
      act({ type: 'settings', fields: { [f]: cur + d } }, 'set'); break;
    }
    case 'draw': { const r = await act({ type: 'draw' }, 'draw'); if (!r.error) { toast('대진을 짰습니다.'); if (S().phase !== 'live') { A.tab = 'run'; render(); } } break; }
    case 'start': { const r = await act({ type: 'start' }, 'start'); if (!r.error) { toast('경기를 시작했습니다.'); A.tab = 'run'; render(); } break; }
    case 'finish': if (arm('finish')) { const r = await act({ type: 'finish' }, 'finish'); if (!r.error) { A.tab = 'rank'; render(); } } break;
    case 'reopen': act({ type: 'reopen' }); break;
    case 'reset': if (arm('reset')) act({ type: 'reset' }); break;
    case 'copy': copy(t.dataset.what === 'cohost' ? cohostUrl() : inviteText()); break;
    case 'share': try { await navigator.share({ title: s.title, text: inviteText() }); } catch (err) {} break;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.hasAttribute('data-draft')) {
    A.drafts[el.id] = el.value;
    if (el.dataset.lvin) A.drafts[el.dataset.lvin + '-self'] = '';
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'bal') act({ type: 'settings', fields: { balanceLevel: el.checked } });
  if (el.id === 'sc-deuce' && A.sheet) { A.sheet.deuce = true; A.sheet.lose = S().target - 1; renderSheet(); }
  if (el.dataset.save && isHost()) {
    const f = el.dataset.save;
    let v = el.value;
    if (f === 'date') { const d = document.getElementById('s-date').value, tm = document.getElementById('s-time').value; v = d ? d + (tm ? 'T' + tm : '') : ''; }
    if ((S()[f] || '') !== v) act({ type: 'settings', fields: { [f]: v } }, 'set').then((r) => { if (!r.error) { delete A.drafts[el.id]; toast('저장했습니다.'); } });
  }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'createForm') createEvent();
  if (e.target.id === 'joinForm') join('yes');
  if (e.target.id === 'addForm') {
    const v = draft('r-name').trim();
    if (!v) return;
    act({ type: 'addPlayer', name: v }, 'addPlayer').then((r) => { if (!r.error) { A.drafts['r-name'] = ''; render(); const el = document.getElementById('r-name'); if (el) el.focus(); } });
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && A.sheet) closeSheet(true); });

// 경과 시간 표시 갱신 (입력 중이 아닐 때만)
setInterval(() => {
  const ae = document.activeElement;
  if (A.s && A.s.phase === 'live' && !A.sheet && !(ae && /INPUT|TEXTAREA/.test(ae.tagName))) render();
}, 30000);

if ('serviceWorker' in navigator && !LOCAL) navigator.serviceWorker.register('sw.js').catch(() => {});

window.__oc = { A, poll, render, toast };
render();
if (A.eid) poll();
})();
</script>
